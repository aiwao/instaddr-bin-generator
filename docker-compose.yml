services:
  db:
    image: postgres:16.11-alpine3.23
    container_name: accounts-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: accountdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d accountdb"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
  app:
    build: .
    image: bin-gen
    environment:
      CREATE_ACCOUNT_DELAY: ${CREATE_ACCOUNT_DELAY}
      CREATE_ADDRESS_DELAY: ${CREATE_ADDRESS_DELAY}
      ON_ERROR_DELAY: ${ON_ERROR_DELAY}
      AMOUNT_ADDRESS: ${AMOUNT_ADDRESS}
      MUST_LEGIT_TO_AMOUNT: ${MUST_LEGIT_TO_AMOUNT}
      PROXY: ${PROXY}

volumes:
  postgres_data:
